<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>IoT Botnets — Interactive Lecture</title><style>*{box-sizing:border-box}body{margin:0;background:#071322;color:#eaf4ff;font:17px/1.55 system-ui,Segoe UI,sans-serif}header{height:62px;display:flex;justify-content:space-between;align-items:center;padding:0 30px;border-bottom:1px solid #29405b;background:#091a2e}header b{letter-spacing:.13em;color:#66d9ff}main{max-width:1180px;margin:25px auto;padding:0 24px}.slide{display:none;min-height:620px;animation:fade .25s}.slide.active{display:block}@keyframes fade{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}.kicker{color:#64d7ff;letter-spacing:.15em;font-size:13px;font-weight:800}h1{font-size:clamp(33px,4.5vw,58px);line-height:1.1;margin:10px 0 12px}h2{font-size:24px;color:#a8c4df;font-weight:450;margin:0 0 25px}.layout{display:grid;grid-template-columns:1.5fr 1fr;gap:22px}.visual,.notes{background:#0e233a;border:1px solid #284761;border-radius:20px;padding:24px;min-height:360px}.notes{font-size:20px}.notes h3{margin:0 0 14px;color:#70dbff;font-size:18px}.source{font-size:12px;color:#a5b7ca;margin-top:28px}.chip,.node{border:1px solid #49728e;background:#16324c;color:#e9f8ff;border-radius:12px;padding:13px 16px;display:inline-flex;align-items:center;justify-content:center;text-align:center}.node{min-width:125px;min-height:72px}.red{border-color:#e97786;background:#47253c}.green{border-color:#61d4ae;background:#153d42}.blue{border-color:#61bfff}.diagram{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:13px;min-height:290px}.arrow{color:#6dd9ff;font-size:30px}.devices{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.device{padding:16px;border:1px solid #47718c;border-radius:12px;background:#18324a;font-size:32px;text-align:center}.device small{display:block;font-size:12px;color:#bcd0e3}.controls{display:flex;align-items:center;gap:12px;justify-content:space-between;max-width:1180px;margin:0 auto;padding:14px 24px 25px}button{background:#1b4260;color:#fff;border:1px solid #5686a5;border-radius:10px;padding:12px 17px;font:inherit;cursor:pointer}button:hover,button:focus{background:#27648a}button:disabled{opacity:.35;cursor:default}.primary{background:#087db1;border-color:#40bdec}.progress{height:5px;background:#1b354e}.progress div{height:100%;background:#43c9ee;transition:width .2s}.step{cursor:pointer}.step.selected{background:#155b73;border-color:#66e8ff}.detail{min-height:80px;background:#0a1c30;border-left:3px solid #55cefa;padding:15px;margin-top:16px;border-radius:8px}.mini{font-size:13px;color:#b1c5d8}.pill{display:inline-block;padding:7px 12px;border-radius:999px;background:#173a53;color:#8fdef8;margin:5px}.choices{display:grid;gap:9px}.choice{text-align:left}.feedback{padding:14px;border-radius:10px;margin-top:12px;background:#123449;min-height:54px}.meter{display:flex;align-items:end;gap:7px;height:165px;justify-content:center}.bar{width:32px;background:#e76c7b;border-radius:5px 5px 0 0;transition:height .4s}.toggle{margin:10px}.source a{color:#91dfff}footer{color:#829db6;font-size:12px;text-align:center;padding:10px}@media(max-width:780px){.layout{grid-template-columns:1fr}.slide{min-height:auto}.visual,.notes{min-height:220px}header{padding:0 12px}main{padding:0 12px}h1{font-size:36px}}@keyframes confettiFall{0%{transform:translate3d(0,-15px,0) rotate(0deg);opacity:1}100%{transform:translate3d(var(--dx),105vh,0) rotate(var(--rot));opacity:0}}.confetti-piece{position:fixed;top:0;left:0;pointer-events:none;z-index:9999;animation:confettiFall var(--dur) cubic-bezier(.15,.65,.35,1) forwards;border-radius:2px}@media(prefers-reduced-motion:reduce){.confetti-piece{animation-duration:.25s!important}}@keyframes fireworkParticle{0%{transform:translate(0,0) scale(1);opacity:1}75%{opacity:1}100%{transform:translate(var(--fx),var(--fy)) scale(.12);opacity:0}}.firework-particle{position:fixed;pointer-events:none;z-index:10001;width:7px;height:7px;border-radius:50%;box-shadow:0 0 11px 3px currentColor;animation:fireworkParticle var(--ftime) ease-out forwards}@media(prefers-reduced-motion:reduce){.firework-particle{animation-duration:.2s!important}}.glossary-btn{background:#154d69;border-color:#69c9ef}.term{color:#8be4ff;border-bottom:1px dashed #8be4ff;cursor:pointer;background:none;padding:0 2px;font:inherit}.term:hover{color:#fff}.glossary-overlay{position:fixed;inset:0;background:#000b;z-index:20000;display:flex;align-items:center;justify-content:center;padding:20px}.glossary-panel{width:min(760px,95vw);max-height:85vh;overflow:auto;background:#10283f;border:1px solid #65c9f4;border-radius:18px;padding:25px;box-shadow:0 20px 80px #0009}.glossary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.glossary-entry{padding:12px;background:#193951;border-radius:10px}.glossary-entry b{color:#81ddff}.glossary-entry p{margin:5px 0;font-size:15px}.glossary-top{display:flex;justify-content:space-between;align-items:center;gap:15px}</style></head><body><header><b>CYBERSECURITY · INTERACTIVE LECTURE</b><div><button class="glossary-btn" onclick="showGlossary()">📖 Simple definitions</button> <span id="count"></span></div></header><div class="progress"><div id="fill"></div></div><main id="deck"></main><div class="controls"><button id="prev" onclick="go(current-1)">← Previous</button><span class="mini">Use ← → keys to navigate</span><button class="primary" id="next" onclick="go(current+1)">Next →</button></div><footer>Adapted for teaching from Vu et al., Future Internet 13(8), 198 (2021) · DOI: 10.3390/fi13080198</footer><script>const glossary={"DDoS":"Distributed Denial of Service: many devices send so much traffic to a website or service that legitimate users cannot reach it.","Firmware":"The built-in software that controls how a device works. Updating it can fix security weaknesses.","Segmented IoT LAN":"A separate part of a local network for smart devices, kept apart from computers and sensitive systems to limit damage if one device is hacked.","Gateway":"A device or service that connects one network to another, often the local network to the Internet.","Firewall":"A security filter that allows or blocks network connections according to rules.","Router":"A device that forwards data between networks, such as your home network and the Internet.","Hub":"A simple network device that repeats incoming data to all its ports. Unlike a switch, it does not choose a specific destination port. A smart-home hub is a different device that coordinates smart gadgets.","C2":"Command and Control: the channel or system through which an attacker sends instructions to infected devices (bots). Also written C&C.","MAC address":"Media Access Control address: an identifier assigned to a network interface, usually used to deliver data on a local network. It can sometimes be changed or spoofed.","DNS":"Domain Name System: the Internet's name lookup service. It translates names such as example.com into IP addresses.","Trojan":"Malicious software that pretends to be legitimate or useful so someone will install or run it.","Malware":"Short for malicious software: programs designed to harm, spy on, disrupt, or take unauthorized control of devices."};function showGlossary(term){let keys=term?[term]:Object.keys(glossary);const layer=document.createElement('div');layer.className='glossary-overlay';layer.onclick=e=>{if(e.target===layer)layer.remove()};layer.innerHTML='<div class="glossary-panel" role="dialog" aria-modal="true"><div class="glossary-top"><h2 style="margin:0;color:#fff">📖 '+(term?term:'Simple cybersecurity definitions')+'</h2><button onclick="this.parentElement.parentElement.parentElement.remove()">✕ Close</button></div><p class="mini">Click highlighted terms on the slides, or open this glossary anytime.</p><div class="glossary-grid">'+keys.map(k=>'<div class="glossary-entry"><b>'+k+'</b><p>'+glossary[k]+'</p></div>').join('')+'</div></div>';document.body.appendChild(layer)}function linkTerms(html){const terms=Object.keys(glossary).sort((a,b)=>b.length-a.length);return html.split(/(<[^>]+>)/g).map(part=>{if(part.startsWith('<'))return part;for(const t of terms){const re=new RegExp('\\b'+t+'\\b','gi');part=part.replace(re,m=>'<button class="term" onclick="showGlossary(&quot;'+t+'&quot;)" title="Click for simple definition">'+m+'</button>')}return part}).join('')}const slides=[["WHAT IS A BOTNET?", "Robot + Network = Botnet", "intro", "<strong>Definition (NIST CSRC):</strong><br><br>“The word ‘botnet’ is formed from the words ‘robot’ and ‘network.’ Cyber criminals use special Trojan viruses to breach the security of several users’ computers, take control of each computer, and organize all the infected machines into a network of ‘bots’ that the criminal can remotely manage.”<br><br><strong>IoT connection:</strong> Connected cameras, routers, and other devices can also become bots.", "NIST CSRC glossary"], ["What is a botnet?", "A network of compromised devices under coordinated control", "network", "A bot is an infected host. The botmaster directs malicious activity through a command-and-control (C2) mechanism. IoT devices may include cameras, routers and sensors.", "\u00a71, pp. 1\u20132"], ["Why IoT devices?", "Connectivity + weak security + scale", "risk", "Common risk factors: poor configuration, outdated software, exposed services, and limited security maintenance. A small device can still generate network traffic. Click highlighted words for simple explanations. Terms such as firmware, router and malware are explained in the glossary.", "\u00a74.1.2 and \u00a75.7, pp. 9, 13"], ["How infection unfolds", "Explore the five conceptual stages", "infection", "Select each stage in the diagram to reveal its purpose. The sequence is a conceptual teaching model, not a universal procedure for every botnet.", "\u00a71, \u00a75.7, pp. 1\u20132, 13"], ["Who controls the bots?", "Centralized C2 versus peer-to-peer", "architecture", "Centralized: a C2 server distributes instructions, but creates a potential single point of failure. P2P: instructions propagate among peers, improving resilience.", "\u00a71 and \u00a75.2, pp. 1\u20132, 11"], ["What do botnets do?", "Different goals, same distributed capability", "attacks", "Botnets can support DDoS disruption, credential theft, spam, malware propagation and other abuse. Their incentives include financial gain and deliberate disruption.", "\u00a71 and \u00a74, pp. 1, 8\u20139"], ["Mirai: an IoT case study", "A landmark example of botnet-enabled DDoS", "mirai", "The survey discusses Mirai\u2019s 2016 DDoS attacks, including an attack against OVH reported at a peak of 1.1 Tbps. Mirai illustrates the risk of insecure connected devices.", "\u00a74.1, p. 8"], ["Detecting botnets", "Look for suspicious patterns, not just malware files", "detect", "The survey reviews traffic analysis, DNS-based methods, signatures, anomaly detection, and machine-learning techniques. Detection results depend on data and environment.", "\u00a76.1, pp. 14 onward"], ["Breaking the attack chain", "Prevent compromise and limit the damage", "defense", "Apply strong unique credentials, patch firmware, disable unused remote services, segment IoT networks and monitor traffic. These are practical teaching recommendations informed by the survey\u2019s mitigation discussion.", "\u00a76.2, p. 25 onward"], ["Knowledge check", "Can you reason about an IoT botnet?", "quiz", "Answer the questions and review the explanations. The aim is to understand the system, not memorize a particular malware family. Use the 📖 Simple definitions button at any time to review DDoS, firmware, segmented IoT LAN, gateway, firewall, router, hub, C2, MAC address, DNS, Trojan and malware.", "Summary of \u00a7\u00a71, 4\u20136"]];let current=0;const root=document.getElementById('deck');function el(tag,cls,html){return `<${tag} class="${cls}">${html}</${tag}>`}function devices(){return `<div class="devices">${[['📷','Camera'],['📡','Router'],['🏠','Smart hub'],['📺','Smart TV']].map(([a,b])=>`<div class="device">${a}<small>${b}</small></div>`).join('')}</div>`}function viz(type){switch(type){case'intro':return `<div class="diagram"><div class="node blue">🌐 Internet</div><span class="arrow">→</span><div class="node red">☠️ Malware</div><span class="arrow">→</span><div class="node">🤖 Botnet</div></div>${devices()}`;case'network':return `<div class="diagram"><div class="node red">👤 Botmaster</div><span class="arrow">→</span><div class="node blue">🖥️ C2 server</div><span class="arrow">→</span><div class="node green">🤖 Bots</div></div>${devices()}`;case'risk':return `${devices()}<div style="text-align:center;margin-top:30px"><span class="pill">🔓 Weak credentials</span><span class="pill">🛠️ Unpatched firmware</span><span class="pill">🌐 Exposed services</span><span class="pill">📦 Mass deployment</span></div>`;case'infection':return `<div class="diagram" id="steps">${['🔎 Discover','🔓 Compromise','🦠 Infect','📡 Connect to C2','⚡ Coordinate'].map((s,i)=>`<button class="step ${i===0?'selected':''}" onclick="stage(${i})">${s}</button>`).join('')}</div><div id="stageDetail" class="detail">1. Discover: exposed or vulnerable devices are identified.</div>`;case'architecture':return `<div style="text-align:center"><button onclick="arch(0)">Centralized C2</button> <button onclick="arch(1)">Peer-to-peer</button></div><div id="archDiagram" class="diagram"><div class="node red">C2</div><span class="arrow">⇢</span><div class="node">Bot A</div><div class="node">Bot B</div><div class="node">Bot C</div></div><div id="archText" class="mini" style="text-align:center">One central controller distributes commands.</div>`;case'attacks':return `<div class="diagram"><div class="node red">🤖 Botnet</div><span class="arrow">→</span><div class="node">🌊 DDoS</div><div class="node">✉️ Spam</div><div class="node">🔑 Credential theft</div><div class="node">🦠 Malware spread</div></div>`;case'mirai':return `<div class="diagram"><div class="node">📷 📡 🏠<br>IoT devices</div><span class="arrow">→</span><div class="node red">🤖 Mirai</div><span class="arrow">→</span><div class="node">🌐 Target service</div></div><div class="detail" style="text-align:center"><b>2016 OVH attack</b><div style="font-size:40px;color:#73ddff;font-weight:800">1.1 Tbps</div><span class="mini">Peak throughput reported by the survey</span></div>`;case'detect':return `<div style="text-align:center">Inspect a hypothetical network-traffic signal</div><div class="meter" id="meter"></div><div style="text-align:center"><button onclick="traffic(false)">Normal traffic</button> <button onclick="traffic(true)">Suspicious traffic</button></div><div class="detail" id="trafficText">Select a traffic scenario to inspect the pattern.</div>`;case'defense':return `<div class="diagram"><div class="node red">Internet threat</div><span class="arrow">→</span><div class="node green">🛡️ Gateway / firewall</div><span class="arrow">→</span><div class="node green">🔒 Segmented IoT LAN</div></div><div style="text-align:center">${['Unique passwords','Firmware updates','Disable unused services','Monitor traffic'].map(s=>`<label class="pill"><input type="checkbox" onchange="defense()"> ${s}</label>`).join('')}</div><div id="defenseText" class="detail">Choose the safeguards you would deploy.</div>`;case'quiz':return `<div id="quiz"></div>`;default:return ''}}function render(){root.innerHTML=slides.map((s,i)=>`<section class="slide ${i===current?'active':''}"><div class="kicker">SLIDE ${i+1} / ${slides.length} · IoT SECURITY</div><h1>${linkTerms(s[0])}</h1><h2>${linkTerms(s[1])}</h2><div class="layout"><div class="visual">${viz(s[2])}</div><div class="notes"><h3>KEY CONCEPT</h3>${linkTerms(s[3])}<div class="source">${i===0?`Source: <a href="https://csrc.nist.gov/glossary/term/botnet" target="_blank" rel="noopener noreferrer">NIST CSRC — Botnet glossary ↗</a>`:`Source: Vu et al. (2021), ${s[4]}<br><a href="https://doi.org/10.3390/fi13080198" target="_blank">Research article ↗</a>`}</div></div></div></section>`).join('');document.getElementById('count').textContent=`${current+1} / ${slides.length}`;document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===slides.length-1;document.getElementById('fill').style.width=`${(current+1)/slides.length*100}%`;if(slides[current][2]==='detect')traffic(false);if(slides[current][2]==='quiz')quiz(0)}function go(n){current=Math.max(0,Math.min(slides.length-1,n));render();window.scrollTo(0,0)}const stages=['1. Discover: exposed or vulnerable devices are identified.','2. Compromise: weak credentials or exploitable weaknesses permit unauthorized access.','3. Infect: malware is installed and the host becomes a bot.','4. Connect to C2: the bot receives commands through a centralized or decentralized channel.','5. Coordinate: multiple bots act together, for example to flood a target with traffic.'];function stage(i){document.getElementById('stageDetail').textContent=stages[i];document.querySelectorAll('.step').forEach((x,j)=>x.classList.toggle('selected',i===j))}function arch(p){document.getElementById('archDiagram').innerHTML=p?'<div class="node">Bot A</div><span class="arrow">↔</span><div class="node">Bot B</div><span class="arrow">↔</span><div class="node">Bot C</div><span class="arrow">↔</span><div class="node">Bot D</div>':'<div class="node red">C2</div><span class="arrow">⇢</span><div class="node">Bot A</div><div class="node">Bot B</div><div class="node">Bot C</div>';document.getElementById('archText').textContent=p?'Peers relay commands; there is no single central command server in this simplified model.':'One central controller distributes commands.'}function traffic(bad){let h=bad?[20,26,35,100,150,135,155,140,160,151,148,160]:[25,35,23,38,28,32,26,39,30,25,34,29];document.getElementById('meter').innerHTML=h.map(x=>`<div class="bar" style="height:${x}px;background:${bad?'#ed7781':'#55c9b1'}"></div>`).join('');document.getElementById('trafficText').textContent=bad?'Suspicious example: an abrupt, sustained increase may justify investigation; volume alone does not prove a botnet.':'Normal example: moderate variations around a baseline.'}function defense(){let n=[...document.querySelectorAll('input[type=checkbox]')].filter(x=>x.checked).length;document.getElementById('defenseText').textContent=`${n}/4 safeguards selected. Defense in depth reduces risk; no single measure guarantees immunity.`}const qs=[['Which statement best defines a botnet?',['A collection of compromised devices controlled together','Any network of smart devices','A firewall protecting IoT devices'],0,'Botnets are groups of infected hosts under coordinated control.'],['Why can centralized C2 be easier to disrupt?',['It never uses the Internet','Its controller may be a single point of failure','It has no bots'],1,'A centralized command server creates a potential single point of failure.'],['What is a useful detection clue?',['All IoT traffic is malicious','An unusual sustained traffic pattern','A device having a MAC address'],1,'Anomalous patterns can trigger investigation, but require context.']];let qi=0,score=0;function quiz(i){qi=i;if(i===0)finalFireworksScheduled=false;let q=qs[i];document.getElementById('quiz').innerHTML=`<div class="kicker">QUESTION ${i+1} OF ${qs.length}</div><h2 style="color:#fff;margin-top:20px">${q[0]}</h2><div class="choices">${q[1].map((c,j)=>`<button class="choice" onclick="answer(${j})">${String.fromCharCode(65+j)}. ${c}</button>`).join('')}</div><div id="feedback" class="feedback">Select an answer.</div>`}function burstConfetti(){const colors=["#ffcc35","#ff5b7e","#4fe0c1","#63b8ff","#b48aff","#ffffff"];for(let wave=0;wave<3;wave++){setTimeout(()=>{for(let i=0;i<190;i++){const p=document.createElement("span");p.className="confetti-piece";p.style.left=(Math.random()*100)+"vw";p.style.top=(-10-Math.random()*120)+"px";p.style.width=(5+Math.random()*9)+"px";p.style.height=(7+Math.random()*13)+"px";p.style.background=colors[Math.floor(Math.random()*colors.length)];p.style.setProperty("--dx",(Math.random()*340-170)+"px");p.style.setProperty("--rot",(Math.random()*1600-800)+"deg");p.style.setProperty("--dur",(5.5+Math.random()*3.5)+"s");document.body.appendChild(p);p.addEventListener("animationend",()=>p.remove(),{once:true});}},wave*750);}}let finalFireworksScheduled=false;function wildFireworks(){const palette=["#ffda45","#ff467b","#58f8ed","#74aaff","#d47bff","#ffffff","#ff923d"];for(let volley=0;volley<15;volley++){setTimeout(()=>{for(let blast=0;blast<3;blast++){const x=12+Math.random()*76,y=12+Math.random()*62;const count=70;for(let k=0;k<count;k++){const a=2*Math.PI*k/count+Math.random()*.12,dist=90+Math.random()*210,p=document.createElement("span");p.className="firework-particle";p.style.left=x+"vw";p.style.top=y+"vh";p.style.color=palette[Math.floor(Math.random()*palette.length)];p.style.background="currentColor";p.style.setProperty("--fx",Math.cos(a)*dist+"px");p.style.setProperty("--fy",Math.sin(a)*dist+"px");p.style.setProperty("--ftime",(1.7+Math.random()*1.8)+"s");document.body.appendChild(p);p.addEventListener("animationend",()=>p.remove(),{once:true});}}},volley*310);}}function answer(j){let q=qs[qi],correct=j===q[2];if(correct){score++;burstConfetti()}if(qi===qs.length-1&&!finalFireworksScheduled){finalFireworksScheduled=true;setTimeout(wildFireworks,2500)}document.querySelectorAll('.choice').forEach(x=>x.disabled=true);document.getElementById('feedback').innerHTML=`<b>${correct?'✓ Correct':'✗ Not quite'}</b> — ${q[3]}<br><button class="primary" style="margin-top:12px" onclick="${qi+1<qs.length?`quiz(${qi+1})`:'finishQuiz()'}">${qi+1<qs.length?'Next question':'See result'}</button>`}function finishQuiz(){document.getElementById('quiz').innerHTML=`<h2>Completed: ${score} / ${qs.length}</h2><p>Review the architecture, infection, and detection slides if needed.</p><button onclick="score=0;quiz(0)">Try again</button>`}document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(current+1);if(e.key==='ArrowLeft')go(current-1)});render();</script></body></html>
